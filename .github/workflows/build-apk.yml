name: Build & Release ClawDroid APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClawDroid-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClawDroid.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClawDroid-Debug-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Publish GitHub Release for Obtainium
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/ClawDroid-${{ github.ref_name }}.apk
            release-assets/ClawDroid.apk
          name: ClawDroid ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          make_latest: true
          body: |
            ## 🤖 ClawDroid ${{ github.ref_name }} Release

            **Autonomous AI Phone Controller (Android 9.0+ / No Root / No Termux)**

            ### 📥 Direct APK Download for Obtainium & Manual Install
            Download **`ClawDroid-${{ github.ref_name }}.apk`** or **`ClawDroid.apk`** below to install/update on your phone.

            ---

            ### 🚀 Highlights:
            - **📋 1-Tap Paste Buttons**: Dedicated paste buttons for Gemini API Key and Telegram Bot Token (no Google Autofill blocking).
            - **🚫 Disabled Password Autofill**: Uses `importantForAutofill="no"` to prevent Google Pass interception.
            - **⚡ Auto-Refresh Service**: Saving new credentials immediately re-initializes background bot and AI loops.
            - **📸 SELinux-Safe Screen Capture**: Direct external cache directory capture for seamless AI visual perception.
            - **🛡️ Bulletproof Telegram Delivery**: HTML formatting with plain-text fallback.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
